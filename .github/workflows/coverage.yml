name: Verifier coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Python verifier coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned coverage tool in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/coverage-venv"
          "$RUNNER_TEMP/coverage-venv/bin/python" -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Measure verifier branch and line coverage
        run: make coverage PYTHON="$RUNNER_TEMP/coverage-venv/bin/python"
      - name: Retain the real coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-verifier-coverage
          path: build/coverage/coverage.xml
          if-no-files-found: error
          retention-days: 14

  codecov:
    name: Codecov upload
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-verifier-coverage
          path: build/coverage
      - name: Upload real Python coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          version: v11.3.2
          files: build/coverage/coverage.xml
          disable_search: true
          plugins: noop
          disable_telem: true
          cleanup: true
          fail_ci_if_error: true
