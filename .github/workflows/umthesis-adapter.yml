name: UMTHESIS v1 LaTeX adapter

on:
  pull_request:
    paths:
      - "scripts/contract_consumer.py"
      - "tests/test_contract_consumer.py"
      - "Makefile"
      - "docs/umthesis-contract.md"
      - ".github/workflows/umthesis-adapter.yml"
  push:
    branches: [main]
    paths:
      - "scripts/contract_consumer.py"
      - "tests/test_contract_consumer.py"
      - "Makefile"
      - "docs/umthesis-contract.md"
      - ".github/workflows/umthesis-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umthesis-latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-adapter:
    name: Pinned contract input and rendered metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout LaTeX source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact canonical UMTHESIS schema/API source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edithatogo/unimelb-thesis-template-typst
          ref: 861a644f8d1e8ede866b213d32f70fdefde5bbe4
          path: build/contract-upstream
          persist-credentials: false
      - name: Verify canonical fixtures and compile LaTeX metadata specimen
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          docker_image: ghcr.io/xu-cheng/texlive-debian:latest@sha256:78ac2204b8df113aca0561e8f173ad5b89ee51e90795173d2fe9bcf0fbce162e
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install --yes --no-install-recommends git make python3 python3-venv python3-pip qpdf poppler-utils
            python3 -m venv build/contract-venv
            build/contract-venv/bin/python -m pip install --disable-pip-version-check --no-input -r build/contract-upstream/requirements-contract.txt
            make contract-check PYTHON=build/contract-venv/bin/python
      - name: Make evidence readable by the runner
        if: always()
        run: |
          if [ -d build/contract ]; then
            sudo chown -R "$(id -u):$(id -g)" build/contract
            chmod -R u+rX build/contract
          fi
      - name: Retain candidate adapter receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latex-umthesis-adapter-receipt
          path: build/contract/latex-native-report.json
          if-no-files-found: warn
          retention-days: 14
