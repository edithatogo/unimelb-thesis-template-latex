name: LaTeX CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:
    inputs:
      replay:
        description: Compare text from two independent clean builds
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    uses: ./.github/workflows/verify-thesis.yml
    with:
      replay: ${{ github.event_name == 'schedule' || inputs.replay == true }}
