name: Verify thesis

on:
  workflow_call:
    inputs:
      replay:
        description: Compare text from two independent clean builds
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the example with the local harness
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          docker_image: ghcr.io/xu-cheng/texlive-debian:latest@sha256:78ac2204b8df113aca0561e8f173ad5b89ee51e90795173d2fe9bcf0fbce162e
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install --yes --no-install-recommends make python3 qpdf poppler-utils
            make ${{ inputs.replay && 'replay' || 'verify' }}
      - name: Make generated evidence readable by the runner
        if: always()
        run: |
          if [ -d build ]; then
            sudo chown -R "$(id -u):$(id -g)" build
            chmod -R u+rX build
          fi
      - name: Retain verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thesis-verification-evidence
          path: |
            build/verification/*.json
            build/verification/*.log
            build/verification/*.blg
            build/verification/*.bbl
            build/verification/*.gls
            build/replay/*.json
            build/replay/*.log
            build/replay/*.blg
            build/replay/*.bbl
            build/replay/*.gls
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the validated PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unimelb-thesis-pdf
          path: build/verification/Thesis.pdf
          if-no-files-found: error
          retention-days: 14
