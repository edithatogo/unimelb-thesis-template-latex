name: LaTeX CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    uses: edithatogo/repository-standards/.github/workflows/latex-ci.yml@7874f05132447c77f681fbca7ad5394066564aaf # main
    with:
      root-file: example/Thesis.tex
      working-directory: "."
      pdf-file: example/out/Thesis.pdf
      artifact-name: unimelb-thesis-pdf
