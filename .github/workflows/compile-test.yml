name: LaTeX CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    uses: edithatogo/repository-standards/.github/workflows/latex-ci.yml@6e2d5e55f7b1af8d6a0e7ccc34202661573dac58 # Container PDF permission fix
    with:
      root-file: example/Thesis.tex
      working-directory: "."
      pdf-file: example/out/Thesis.pdf
      artifact-name: unimelb-thesis-pdf
